<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" fill="none">
  <defs>
    <linearGradient id="bookCover" x1="30" y1="30" x2="210" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B5E7D" />
      <stop offset="100%" stop-color="#4B344D" />
    </linearGradient>
    <linearGradient id="bookPage" x1="40" y1="40" x2="200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F8EFE3" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="150" y1="110" x2="190" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE8A2" />
      <stop offset="100%" stop-color="#D1A76A" />
    </linearGradient>
  </defs>

  <!-- Ambient shadow under journal -->
  <ellipse cx="120" cy="165" rx="85" ry="18" fill="#4B344D" fill-opacity="0.10" />

  <!-- Open Journal Cover Base -->
  <path d="M 35 145 C 75 140, 115 145, 120 152 C 125 145, 165 140, 205 145 L 205 60 C 165 55, 125 60, 120 67 C 115 60, 75 55, 35 60 Z" fill="url(#bookCover)" stroke="#241C24" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Left Open Page -->
  <path d="M 40 58 C 75 54, 110 58, 118 64 L 118 146 C 110 140, 75 136, 40 140 Z" fill="url(#bookPage)" stroke="#4B344D" stroke-width="1.8" stroke-linejoin="round" />
  
  <!-- Right Open Page -->
  <path d="M 122 64 C 130 58, 165 54, 200 58 L 200 140 C 165 136, 130 140, 122 146 Z" fill="url(#bookPage)" stroke="#4B344D" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Page Spine / Stitch -->
  <line x1="120" y1="65" x2="120" y2="148" stroke="#D1A76A" stroke-width="2" stroke-linecap="round" />

  <!-- Left Page Doodle: Heart & Lines -->
  <path d="M 65 80 C 60 75, 52 77, 52 83 C 52 90, 65 98, 65 98 C 65 98, 78 90, 78 83 C 78 77, 70 75, 65 80 Z" fill="#D99A9A" stroke="#4B344D" stroke-width="1.2" />
  <line x1="50" y1="108" x2="95" y2="108" stroke="#B8A5C9" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="118" x2="85" y2="118" stroke="#B8A5C9" stroke-width="2" stroke-linecap="round" />

  <!-- Right Page Doodle: Lemon & Sparkle -->
  <ellipse cx="160" cy="90" rx="14" ry="11" fill="#F3D7A4" stroke="#4B344D" stroke-width="1.4" />
  <path d="M 160 79 C 163 74, 169 73, 172 76" stroke="#2D3B26" stroke-width="1.2" stroke-linecap="round" />
  <line x1="145" y1="112" x2="185" y2="112" stroke="#B8A5C9" stroke-width="2" stroke-linecap="round" />
  <line x1="145" y1="122" x2="175" y2="122" stroke="#B8A5C9" stroke-width="2" stroke-linecap="round" />

  <!-- Floating Sparkles around journal -->
  <circle cx="95" cy="42" r="3" fill="#D1A76A" />
  <circle cx="170" cy="38" r="2.5" fill="#D99A9A" />
  <circle cx="30" cy="110" r="2" fill="#B8A5C9" />
  <circle cx="215" cy="100" r="2.5" fill="#A8B89A" />
</svg>
