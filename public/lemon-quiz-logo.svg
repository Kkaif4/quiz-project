<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030214"/>
      <stop offset="0.48" stop-color="#0d0730"/>
      <stop offset="1" stop-color="#17105c"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="70%" cy="15%" r="85%">
      <stop offset="0" stop-color="#24106e" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#09051f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.05" y1="0.05" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#fffaff"/>
      <stop offset="0.24" stop-color="#d7c7ff"/>
      <stop offset="0.48" stop-color="#c06cff"/>
      <stop offset="0.72" stop-color="#741cff"/>
      <stop offset="1" stop-color="#1745ff"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0.1" y1="0.85" x2="0.9" y2="0.15">
      <stop offset="0" stop-color="#ff58ff"/>
      <stop offset="0.42" stop-color="#7c21ff"/>
      <stop offset="1" stop-color="#164bff"/>
    </linearGradient>
    <linearGradient id="heart" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#fffaff"/>
      <stop offset="0.34" stop-color="#e9ddff"/>
      <stop offset="0.66" stop-color="#ae75ff"/>
      <stop offset="1" stop-color="#713cff"/>
    </linearGradient>
    <linearGradient id="tail" x1="0.1" y1="0.1" x2="0.9" y2="0.85">
      <stop offset="0" stop-color="#fffaff"/>
      <stop offset="0.35" stop-color="#dbcaff"/>
      <stop offset="0.7" stop-color="#a66dff"/>
      <stop offset="1" stop-color="#7b35ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 .35  0 0 1 0 .05  0 0 1 0 .9  0 0 0 .7 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <clipPath id="rounded"><rect width="1024" height="1024" rx="118"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#bgGlow)"/>
    <ellipse cx="710" cy="210" rx="330" ry="220" fill="#4a16c8" opacity=".18" filter="url(#softGlow)"/>
    <ellipse cx="250" cy="820" rx="350" ry="180" fill="#3711a8" opacity=".16" filter="url(#softGlow)"/>
  </g>

  <!-- Outer rounded border -->
  <rect x="2" y="2" width="1020" height="1020" rx="118" fill="none" stroke="#3211a8" stroke-width="4" opacity=".9"/>

  <!-- Main Q ring -->
  <g filter="url(#glow)">
    <path d="M 835 594 C 835 775 690 918 508 918 C 325 918 181 776 181 594 C 181 412 326 269 508 269 C 690 269 835 412 835 594 Z
             M 681 594 C 681 499 606 423 510 423 C 414 423 338 499 338 594 C 338 689 414 766 510 766 C 606 766 681 689 681 594 Z"
          fill="url(#ring2)" fill-rule="evenodd"/>
    <!-- bright upper-left highlight -->
    <path d="M 201 566 C 212 405 343 286 502 270 C 592 261 676 288 738 342 C 647 292 530 282 431 322 C 301 374 224 470 201 566 Z"
          fill="#fffaff" opacity=".92"/>
    <!-- blue lower-right body -->
    <path d="M 815 620 C 803 776 673 905 511 918 C 650 875 731 779 739 657 C 744 585 725 514 686 454 C 761 494 809 549 815 620 Z"
          fill="#174cff" opacity=".8"/>
  </g>

  <!-- Inner dark opening -->
  <circle cx="510" cy="594" r="158" fill="#02020a"/>

  <!-- Heart -->
  <path d="M 510 676
           C 489 658 411 600 373 554
           C 331 503 346 440 394 413
           C 440 387 490 406 510 445
           C 531 406 580 387 627 413
           C 675 440 689 503 647 554
           C 609 600 531 658 510 676 Z"
        fill="url(#heart)" filter="url(#glow)"/>

  <!-- Q tail / ribbon -->
  <path d="M 562 707
           C 650 724 705 754 757 790
           C 809 826 857 850 905 855
           C 929 858 946 850 948 862
           C 951 879 936 904 911 924
           C 877 951 838 958 802 947
           C 760 934 720 900 683 860
           C 645 819 613 780 560 754
           C 541 745 532 724 562 707 Z"
        fill="url(#tail)" filter="url(#glow)"/>

  <!-- Subtle highlight on tail -->
  <path d="M 592 730 C 675 748 719 775 765 807 C 815 842 858 863 909 865 C 879 873 839 864 797 844 C 744 819 697 785 647 764 C 625 755 606 744 592 730 Z"
        fill="#ffffff" opacity=".2"/>
</svg>
