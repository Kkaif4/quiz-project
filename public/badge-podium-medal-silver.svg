  <circle cx="20" cy="24" r="6.5" fill="none" stroke="#4B344D" stroke-width="0.8" stroke-dasharray="2 1.5" />
  
  <text x="20" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#4B344D" text-anchor="middle">2</text>
