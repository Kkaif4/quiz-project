<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160" fill="none">
  <defs>
    <linearGradient id="leafGradLeft" x1="10" y1="10" x2="110" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2D1B6" />
      <stop offset="60%" stop-color="#A8B89A" />
      <stop offset="100%" stop-color="#889C79" />
    </linearGradient>
  </defs>

  <!-- Branch stem -->
  <path d="M 110 155 C 80 130, 45 90, 20 20" stroke="#6F8360" stroke-width="2.5" stroke-linecap="round" />

  <!-- Leaves along branch -->
  <!-- Leaf 1 (Top) -->
  <path d="M 20 20 C 10 5, 25 0, 35 10 C 40 20, 30 25, 20 20 Z" fill="url(#leafGradLeft)" stroke="#5B6F4D" stroke-width="1.2" />
  
  <!-- Leaf 2 (Left) -->
  <path d="M 38 48 C 15 42, 10 60, 25 70 C 35 75, 42 60, 38 48 Z" fill="url(#leafGradLeft)" stroke="#5B6F4D" stroke-width="1.2" />

  <!-- Leaf 3 (Right) -->
  <path d="M 52 75 C 75 60, 85 78, 75 90 C 65 100, 50 88, 52 75 Z" fill="url(#leafGradLeft)" stroke="#5B6F4D" stroke-width="1.2" />

  <!-- Leaf 4 (Left lower) -->
  <path d="M 68 108 C 45 105, 40 125, 55 135 C 70 140, 75 120, 68 108 Z" fill="url(#leafGradLeft)" stroke="#5B6F4D" stroke-width="1.2" />

  <!-- Tiny Gold Starburst sparkle -->
  <circle cx="28" cy="40" r="2" fill="#F3D7A4" />
  <circle cx="82" cy="115" r="1.5" fill="#D99A9A" />
</svg>
