<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" width="180" height="44" fill="none">
  <defs>
    <linearGradient id="lockupLemon" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE8A2" />
      <stop offset="100%" stop-color="#D1A76A" />
    </linearGradient>
    <linearGradient id="lockupHeart" x1="16" y1="16" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAA6A6" />
      <stop offset="100%" stop-color="#C26D6D" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(2, 4)">
    <path d="M 9 23 C 6 16, 13 9, 21 9 C 30 9, 34 17, 31 24 C 28 31, 17 33, 11 29 C 7 27, 6 24, 9 23 Z" fill="url(#lockupLemon)" stroke="#4B344D" stroke-width="1.6" stroke-linejoin="round" />
    <!-- Leaf -->
    <path d="M 22 10 C 25 4, 33 3, 36 7 C 36 12, 31 14, 25 12 Z" fill="#A8B89A" stroke="#2D3B26" stroke-width="1.3" />
    <!-- Center Heart -->
    <path d="M 20 19 C 18.5 17, 15.5 17.5, 15.5 19.5 C 15.5 22, 20 25, 20 25 C 20 25, 24.5 22, 24.5 19.5 C 24.5 17.5, 21.5 17, 20 19 Z" fill="url(#lockupHeart)" stroke="#4B344D" stroke-width="1" />
  </g>

  <!-- Wordmark Text -->
  <text x="44" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5" fill="currentColor">
    <tspan fill="#6D526F">Lemon</tspan><tspan fill="#D1A76A">Quiz</tspan>
  </text>
  
  <!-- Subtle heart accent over the i dot -->
  <circle cx="160.5" cy="16" r="1.8" fill="#D99A9A" />
</svg>
