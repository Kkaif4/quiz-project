<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="lemonGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE8A2" />
      <stop offset="45%" stop-color="#F3D7A4" />
      <stop offset="100%" stop-color="#D1A76A" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="28" y1="4" x2="44" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8C8AA" />
      <stop offset="100%" stop-color="#6F8360" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="18" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAA6A6" />
      <stop offset="100%" stop-color="#C26D6D" />
    </linearGradient>
  </defs>
  
  <!-- Subtle back shadow/glow -->
  <ellipse cx="24" cy="27" rx="16" ry="14" fill="#6D526F" fill-opacity="0.08" />

  <!-- Main Lemon Body (Slightly tilted organic oval) -->
  <path d="M 12 28 C 8 20, 16 12, 26 12 C 36 12, 41 21, 38 30 C 35 38, 22 41, 14 36 C 10 33, 8 30, 12 28 Z" fill="url(#lemonGrad)" stroke="#4B344D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Left Lemon Pip/Nip -->
  <path d="M 11 27 C 8 26, 7 24, 9 22" stroke="#4B344D" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Right Lemon Pip/Nip -->
  <path d="M 38 29 C 41 31, 42 33, 40 35" stroke="#4B344D" stroke-width="1.8" stroke-linecap="round" />

  <!-- Botanical Leaf on Top -->
  <path d="M 27 13 C 30 6, 40 5, 43 9 C 44 15, 38 18, 30 15 Z" fill="url(#leafGrad)" stroke="#2D3B26" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M 28 13 C 33 11, 37 10, 41 9" stroke="#2D3B26" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

  <!-- Cute Heart Center Emblem -->
  <path d="M 24 24 C 22.5 21.5, 19 22, 19 24.5 C 19 27.5, 24 31, 24 31 C 24 31, 29 27.5, 29 24.5 C 29 22, 25.5 21.5, 24 24 Z" fill="url(#heartGrad)" stroke="#4B344D" stroke-width="1.2" />
  
  <!-- Sparkle dot -->
  <circle cx="21" cy="18" r="1.2" fill="#FFFFFF" opacity="0.9" />
</svg>
